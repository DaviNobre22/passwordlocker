[package]
name = "locker-core"
description = "Vault format, crypto and entry logic for passwordlocker. No UI."
version.workspace = true
edition.workspace = true

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
getrandom = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
unicode-normalization = "0.1.25"
zeroize = "1.9"
zxcvbn = { version = "3.1.1", default-features = false }

[dev-dependencies]
tempfile = "3"
