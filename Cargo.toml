[workspace]
members = ["crates/locker-core", "src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

# Our own crates stay unoptimized for fast rebuilds and good debugging, but
# dependencies are optimized: Argon2id is unusably slow in a debug build.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
